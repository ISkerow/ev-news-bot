[tool.ruff]
# Проект заявлен как Python 3.10+, поэтому синтаксис 3.11 не предлагаем
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "FURB"]

ignore = [
    # Широкий except — здесь осознанная политика, а не небрежность: бот не должен
    # падать из-за чужого сбоя. Каждый такой блок пишет причину в лог и уходит
    # на запасной путь (другой переводчик, текст вместо фото, обычный перевод
    # вместо ИИ). Публикация новостей важнее аккуратной типизации исключений.
    "BLE001",
    # Кириллица в строках и комментариях — язык проекта, а не «подозрительные
    # символы, похожие на латиницу»
    "RUF001", "RUF002", "RUF003",
    # Числа прямо в сравнениях: 60 секунд, 1024 символа подписи, лимиты Telegram.
    # Рядом с ними стоит комментарий, выносить в константы ради одного места —
    # лишний слой
    "PLR2004",
    # Вложенные with у aiohttp (сессия → запрос) читаются лучше, чем один
    # длинный with с двумя контекстами
    "SIM117",
    # Длина функций: воркер очереди и сборка поста длиннее порога, но дробить
    # их на части означало бы растаскивать последовательный сценарий по файлу
    "PLR0911", "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы длинные проверки, числа прямо в сравнениях и компактные
# однострочные заглушки
"tests/*" = ["E501", "PLR2004", "E702"]
